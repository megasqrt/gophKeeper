edition = "2023";

package gophkeeper;

option go_package = "gophKeeper/pkg/proto";

// TimeMap содержит временные метки для синхронизации
message TimeMap {
    int64 change_time = 1; // Время последнего изменения (nanoseconds since epoch)
    int64 sync_time = 2; // Время последней синхронизации (nanoseconds since epoch)
}

// ShortItem представляет краткую информацию об элементе для синхронизации
message ShortItem {
    string local_id = 1; // Локальный идентификатор клиента
    string server_id = 2; // Идентификатор на сервере (может быть пустым для новых элементов)
    string checksum = 3; // Контрольная сумма данных для определения изменений
    string type = 4; // Тип предпологаемой операции
}

// Response используется для возврата server_id после операций
message Response {
    string server_id = 1; // Идентификатор на сервере
}

// ShortSyncResponse возвращает список локальных ID элементов, которые нужно синхронизировать полностью
message ShortSyncResponse {
    repeated string local_ids = 1; // Список локальных ID для полной синхронизации (от клиента на сервер)
    repeated string server_ids = 2; // Список серверных ID элементов, которых нет на клиенте (для получения с сервера)
}