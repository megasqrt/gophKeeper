edition = "2023";

package gophkeeper;

option go_package = "gophKeeper/pkg/proto";

// ShortItem представляет краткую информацию об элементе для синхронизации
message ShortItem {
    int64 local_id = 1; // Локальный идентификатор клиента
    int64 server_id = 2; // Идентификатор на сервере (может быть пустым для новых элементов)
    string checksum = 3; // Контрольная сумма данных для определения изменений
    string type = 4; // Тип предпологаемой операции
}

// Response используется для возврата server_id после операций
message Response {
    int64 server_id = 1; // Идентификатор на сервере
}

// ShortSyncResponse возвращает список локальных ID элементов, которые нужно синхронизировать полностью
message ShortSyncResponse {
    repeated int64 local_ids = 1; // Список локальных ID для полной синхронизации (от клиента на сервер)
    repeated int64 server_ids = 2; // Список серверных ID элементов, которых нет на клиенте (для получения с сервера)
}